<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nahyun Kim</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
  }

  body {
    font-family: 'Helvetica Neue', Helvetica;
    background: linear-gradient(to bottom, #ffffff 0%, #ffff00 100%);
    position: relative;
    overflow: hidden;
  }

  /* 상단 파란 줄 */
  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 6px;
    background: #ffffff;
  }

 /* 얼굴 그림 3개 겹쳐서 배치하는 영역 */
.face-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.face-layer img {
  position: absolute;
  max-height: 70%;
  width: auto;
  object-fit: contain;
  opacity: 0;
  animation: fadeIn 2.8s ease forwards;
}

.face-1 {
  left: 5%;
  top: 3%;
  max-height: 65%;
  animation-delay: 0s;
}

.face-2 {
  left: 25%;
  top: 3%;
  max-height: 65%;
  animation-delay: 1.5s;
}

.face-3 {
  left: 45%;
  top: 3%;
  max-height: 65%;
  animation-delay: 3s;
}

@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
  /* 텍스트 영역 */
  .content {
        font-family: 'Helvetica Neue', Helvetica;
    position: absolute;
    bottom: 80px;
    left: 60px;
    z-index: 10;
  }

  .content h1 {
        font-family: 'Helvetica Neue', Helvetica;
    font-size: 5.5vw;
    font-weight: 900;
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 20px;
  }

  .content .subtitle {
        font-family: 'Helvetica Neue', Helvetica;
    font-size: 20px;
    margin-bottom: 4px;
  }

  .content .info {
        font-family: 'Helvetica Neue', Helvetica;
    font-size: 16px;
    margin-top: 20px;
    line-height: 1.4;
  }

  /* 뒤로가기 버튼 */
  .back-btn {
        font-family: 'Helvetica Neue', Helvetica;
    position: absolute;
    bottom: 10px;
    left: 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    text-decoration: none;
    color: #ff0000;
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
  }

  .back-btn img {
    width: 50px;
  }
</style>
</head>
<body>

  <div class="top-bar"></div>

  <!-- 얼굴 그림 3개: 흐린 것부터 진한 것 순으로 겹쳐 배치 -->
  <div class="face-layer">
    <img class="face-1" src="1.png" alt="">
    <img class="face-2" src="2.png" alt="">
    <img class="face-3" src="3.png" alt="">
  </div>

  <!-- 텍스트 콘텐츠 -->
  <div class="content">
    <h1>Nahyun Kim</h1>
    <div class="subtitle">Visual · Sound</div>
    <div class="subtitle">nahyeon050300@gmail.com</div>
    <div class="subtitle">www.linkedin.com/in/9ni</div>
    <div class="info">
      HONGIK UNIVERSITY<br>
      DESIGN CONVERGENCE 2024~
    </div>
  </div>

  <!-- 뒤로가기 버튼 -->
  <a href="index.html" class="back-btn">
    <img src="back.png" alt="Back">
    BACK
  </a>

</body>
</html>
